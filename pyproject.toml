[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pylss"
version = "0.1.0"
description = "Python package for linear solvent strength calculations"
readme = "README.md"
authors = [
  { name = "Giuseppe Marco Randazzo", email = "gmrandazzo@gmail.com" }
]
license = { text = "AGPL" }
dependencies = [
  "numpy",
  "matplotlib",
  "scipy",
  "PyQt6",
  "PyYAML",
]

[project.optional-dependencies]
test = ["pytest"]
dev = [
    "mypy",
    "types-PyYAML",
]

[project.gui-scripts]
pylss-gui = "pylss.gui.pylss_gui:main"
pylss-chromanalyzer = "pylss.gui.chromanalyzer:main"

[project.scripts]
pylss-lssgen = "pylss.lssgen:main"
pylss-lssopt = "pylss.lssoptseparation:main"
pylss-logssgen = "pylss.logssgen:main"
pylss-logssopt = "pylss.logssoptseparation:main"
pylss-makechrom = "pylss.MakeChromatogram:main"

[project.urls]
Homepage = "https://github.com/gmrandazzo/PyLSS"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["pylss", "pylss.gui"]
